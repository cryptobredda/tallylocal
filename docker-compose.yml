services:
  finance:
    build: .
    container_name: tallylocal
    ports:
      - "5000:5000"
    environment:
      - FLASK_ENV=production
      - DATA_DIR=/data
      - USERS_DB_PATH=/data/users.db
      - USER_DATA_DIR=/data/user_data
      - UPLOADS_DIR=/data/uploads
      - TALLY_HOST=0.0.0.0
      - TALLY_ALLOW_REMOTE=1
      - PORT=5000
      # Set SECRET_KEY and TALLY_ENCRYPTION_KEY in .env for stable sessions and
      # decryptable bank connections. Without them, keys are generated into /data.
      - SECRET_KEY=${SECRET_KEY:-}
      - TALLY_ENCRYPTION_KEY=${TALLY_ENCRYPTION_KEY:-}
    volumes:
      - finance_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/api/v1/health"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  finance_data:
